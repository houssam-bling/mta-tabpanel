# Configuration & API Integration
# For connecting TabPanel to your MTA server

# Server Configuration
SERVER_HOST = "localhost"
SERVER_PORT = 22005
API_PORT = 8080

# Database Configuration
DATABASE_TYPE = "mysql"  # Options: mysql, sqlite
DATABASE_HOST = "localhost"
DATABASE_USER = "root"
DATABASE_PASSWORD = ""
DATABASE_NAME = "mta_server"

# Panel Settings
PANEL_TITLE = "THE NORTH ROLEPLAY"
REFRESH_INTERVAL = 5000  # milliseconds
MAX_PLAYERS = 512

# Feature Flags
ENABLE_SEARCH = true
ENABLE_FILTERS = true
ENABLE_PLAYER_STATS = true
ENABLE_ADMIN_CONTROLS = true
SHOW_PLAYER_IP = false  # Security: don't show IPs in public

# Styling
THEME = "dark"  # Options: dark, light
PRIMARY_COLOR = "#1e5a96"
SECONDARY_COLOR = "#2a3f5f"
ACCENT_COLOR = "#64b5f6"
